# Sentinel thresholds. Anything left out falls back to the defaults in sentinel/config.py.

interval: 2          # seconds between samples

# Signals require --pid targets and --contain (or the isolated --demo).
warn_at: 40
contain_at: 70
protected_names: [systemd, init, sshd, NetworkManager, sentinel]

rules:
  cpu:
    percent: 90      # % of one core
    for_seconds: 10  # has to stay above it this long
    score: 15
  children:
    count: 50        # whole process subtree, not just direct children
    score: 25
  file_changes:
    # Estimated MODIFY events, attributed through visible writable /proc/PID/fd entries.
    count: 100
    window: 10       # seconds
    score: 40
  connections:
    count: 100
    score: 20
  open_files:
    # All file descriptors, including sockets and pipes.
    count: 500
    score: 15
